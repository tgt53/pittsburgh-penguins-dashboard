{% extends "base.html" %}

{% block title %}Pittsburgh Penguins | Player Roster{% endblock %}

{% block content %}
<section class="roster-hero">
    <h1>Pittsburgh<br><em>Penguins</em></h1>
    <a class="roster-scroll" href="#forwards">Explore the roster</a>
    <img class="hero-mark" src="{{ url_for('static', filename='images/penguins_logo.png') }}" alt="" aria-hidden="true">
</section>

<div id="roster-groups" class="roster-groups" data-season-id="{{ season_id }}">
    <section class="roster-section" id="forwards" aria-labelledby="forwards-title">
        <div class="roster-section-heading"><h2 id="forwards-title">Forwards <span class="roster-count" data-count-for="forwards"></span></h2></div>
        <div class="player-grid" data-position="forwards"></div>
    </section>
    <section class="roster-section" id="defense" aria-labelledby="defense-title">
        <div class="roster-section-heading"><h2 id="defense-title">Defense <span class="roster-count" data-count-for="defensemen"></span></h2></div>
        <div class="player-grid" data-position="defensemen"></div>
    </section>
    <section class="roster-section" id="goalies" aria-labelledby="goalies-title">
        <div class="roster-section-heading"><h2 id="goalies-title">Goalies <span class="roster-count" data-count-for="goalies"></span></h2></div>
        <div class="player-grid" data-position="goalies"></div>
    </section>
</div>
<script>
const seasonId = document.getElementById('roster-groups').dataset.seasonId;
function playerName(p) {
  const first = p.firstName?.default || p.firstName || '';
  const last = p.lastName?.default || p.lastName || '';
  return `${first} ${last}`.trim();
}
function playerLastName(p) {
  return safeName(p.lastName) || playerName(p).trim().split(/\s+/).pop() || '';
}
function safeName(value) {
  return value && typeof value === 'object' ? (value.default || '') : (value || '');
}
function renderPlayer(p) {
  const name = playerName(p);
  const id = p.id || p.playerId;
  const photo = p.headshot || `https://assets.nhle.com/mugs/nhl/${seasonId}/PIT/${id}.png`;
  const card = document.createElement('a');
  card.className = 'player-card';
  card.href = `/players/${id}`;
  card.setAttribute('aria-label', `View ${name}'s player profile`);
  const image = document.createElement('img');
  image.className = 'player-headshot'; image.src = photo; image.alt = '';
  image.loading = 'lazy'; image.onerror = () => { image.src = '/static/images/penguins_logo.png'; image.classList.add('headshot-fallback'); };
  const meta = document.createElement('span'); meta.className = 'player-meta';
  const label = document.createElement('span'); label.className = 'player-name'; label.textContent = name;
  const pos = document.createElement('span'); pos.className = 'player-position';
  const rawPosition = p.positionCode || p.position || '';
  const position = rawPosition === 'L' ? 'LW' : rawPosition === 'R' ? 'RW' : rawPosition;
  pos.textContent = [p.sweaterNumber ? `#${p.sweaterNumber}` : '', position].filter(Boolean).join(' · ');
  meta.append(label, pos); card.append(image, meta); return card;
}
fetch(`/api/roster/${seasonId}`)
  .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error || `Roster unavailable (HTTP ${response.status}).`); return data; })
  .then(roster => {
    ['forwards', 'defensemen', 'goalies'].forEach(group => {
      const grid = document.querySelector(`[data-position="${group}"]`);
      const players = (roster[group] || []).slice().sort((a, b) =>
        playerLastName(a).localeCompare(playerLastName(b)) || playerName(a).localeCompare(playerName(b))
      );
      document.querySelector(`[data-count-for="${group}"]`).textContent = players.length;
      players.forEach(p => grid.append(renderPlayer(p)));
      if (!players.length) grid.closest('.roster-section').hidden = true;
    });
  })
  .catch(error => console.error('The roster could not be loaded.', error));
</script>
{% endblock %}
